name: tests

on:
  push:
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: payroll_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      PAYROLL_MYSQL_TESTS: "1"
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-root-password
      MYSQL_DATABASE: payroll_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Allow trigger creation with binary logging on
        run: mysql -h 127.0.0.1 -uroot -pci-root-password -e "SET GLOBAL log_bin_trust_function_creators = 1"
      - run: python -m unittest tests.test_mysql -v
