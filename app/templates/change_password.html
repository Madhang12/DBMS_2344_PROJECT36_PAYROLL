{% extends 'base.html' %}
{% block title %}Change password{% endblock %}
{% block heading %}Change password{% endblock %}
{% block sub %}Signed in as {{ user.username }} ({{ user.role }}){% endblock %}
{% block content %}
<div class="cardx" style="max-width:480px"><div class="bd"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="form-label" for="current_password">Current password</label>
  <input class="form-control mb-3" id="current_password" name="current_password" type="password" required>
  <label class="form-label" for="new_password">New password (min 8 characters)</label>
  <input class="form-control mb-3" id="new_password" name="new_password" type="password" required minlength="8">
  <label class="form-label" for="confirm_password">Confirm new password</label>
  <input class="form-control mb-4" id="confirm_password" name="confirm_password" type="password" required>
  <button class="btn btn-navy"><i class="bi bi-check2"></i> Change password</button>
</form></div></div>
{% endblock %}
