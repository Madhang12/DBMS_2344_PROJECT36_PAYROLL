{% extends '_auth.html' %}
{% block title %}Sign in{% endblock %}
{% block body %}
<h1>Sign in</h1>
<p class="lead">Use the account your administrator gave you.</p>
<form method="post" autocomplete="on"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next or '' }}">
  <label class="form-label" for="username">Username</label>
  <input class="form-control mb-3" id="username" name="username" autofocus required autocomplete="username">
  <div class="d-flex justify-content-between"><label class="form-label" for="password">Password</label>
    <a class="small" href="{{ url_for('forgot_password') }}">Forgot password?</a></div>
  <input class="form-control mb-4" id="password" name="password" type="password" required autocomplete="current-password">
  <button class="btn btn-navy w-100"><i class="bi bi-box-arrow-in-right"></i> Sign in</button>
</form>
<div class="auth-note">Demo accounts (synthetic data): <b>admin</b>, <b>hr</b>, <b>emp001</b> to <b>emp005</b>. The demo password is set by <code>DEMO_PASSWORD</code> in the README.</div>
{% endblock %}
